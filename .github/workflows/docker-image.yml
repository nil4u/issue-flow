# [INPUT]: 依赖 main push/workflow_dispatch、两个 package.json、console/Dockerfile 与 plugin 源码
# [OUTPUT]: 为新版本创建 plugin/console tag，并只构建一次 console 镜像
# [POS]: main 合并后的版本标记与镜像发布入口
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

name: Console Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag for a manual rebuild"
        required: false
        type: string
      latest:
        description: "Also publish latest"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: console-docker-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-console

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      console_tag: ${{ steps.version.outputs.console_tag }}
      console_tag_created: ${{ steps.version.outputs.console_tag_created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create version tags
        id: version
        run: |
          plugin_version=$(node -p "require('./plugin/package.json').version")
          console_version=$(node -p "require('./console/api/package.json').version")

          plugin_tag="v${plugin_version}"
          if git rev-parse --verify --quiet "refs/tags/$plugin_tag" >/dev/null; then
            echo "Tag already exists: $plugin_tag"
          else
            git tag "$plugin_tag" "$GITHUB_SHA"
            git push origin "$plugin_tag"
          fi

          console_tag="console-v${console_version}"
          console_tag_created=false
          if git rev-parse --verify --quiet "refs/tags/$console_tag" >/dev/null; then
            echo "Tag already exists: $console_tag"
          else
            git tag "$console_tag" "$GITHUB_SHA"
            git push origin "$console_tag"
            console_tag_created=true
          fi
          {
            echo "console_tag=$console_tag"
            echo "console_tag_created=$console_tag_created"
          } >> "$GITHUB_OUTPUT"

  prepare:
    needs: tag
    if: needs.tag.outputs.console_tag_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Image version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            printf 'version=%s\n' "${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            printf 'version=%s\n' "${{ needs.tag.outputs.console_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' || inputs.latest }}
            type=sha

  publish:
    needs: prepare
    uses: ./.github/workflows/console-image-publish.yml
    secrets: inherit
    with:
      image_name: ghcr.io/${{ github.repository }}-console
      tags: ${{ needs.prepare.outputs.tags }}
      labels: ${{ needs.prepare.outputs.labels }}
      version: ${{ needs.prepare.outputs.version }}
